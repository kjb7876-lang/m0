name: StoryWorld R68 planar-path verification
on:
  push:
    branches: [work/storyworld-r68-path-perf]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storyworld-r68-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct R66 and verify the unchanged R67 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/r66 out/r67 out/r68
          python3 scripts/unpack-runtime-r62.py --output _baseline/docs
          python3 scripts/apply-r66.py --site _baseline/docs
          cp -a _baseline _pages
          python3 scripts/apply-r67.py --site _pages/docs
          node --test scripts/campaign-balance-r64.cpu.test.mjs scripts/r66.cpu.test.mjs scripts/r66.render.test.mjs scripts/r67.cpu.test.mjs | tee out/r68/baseline-cpu.log
      - name: Install pinned sandboxed browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.56.0 > out/r68/dependencies.log 2>&1
          npx playwright install --with-deps chromium >> out/r68/dependencies.log 2>&1
      - name: Preserve R67 WebGL gate and build R68 against exact published bytes
        shell: bash
        env:
          STORYWORLD_URL: http://127.0.0.1:4391/
        run: |
          set -euo pipefail
          python3 -m http.server 4391 --directory _pages/docs --bind 127.0.0.1 > out/r68/http-baseline.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r67.browser.test.mjs | tee out/r68/baseline-webgl.log
          mv _baseline _r66
          cp -a _pages _baseline
          python3 scripts/apply-r68.py --site _pages/docs | tee out/r68/build.log
          node --check _pages/docs/dist/phase1.js
          node --test scripts/r68.cpu.test.mjs | tee out/r68/cpu-tests.log
          node verify-pages-r62.mjs _pages | tee out/r68/integrity.log
          node scripts/r68.browser.test.mjs | tee out/r68/webgl-test.log
          node scripts/r66.browser.test.mjs | tee out/r68/game-regression.log
      - name: Compare unchanged movement and real EGO stress harnesses
        shell: bash
        env:
          STORYWORLD_URL: http://127.0.0.1:4391/
        run: |
          set -euo pipefail
          python3 -m http.server 4391 --directory _pages/docs --bind 127.0.0.1 > out/r68/http-perf.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r68.perf.mjs | tee out/r68/performance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r68-path-evidence
          path: |
            out/r66/
            out/r67/
            out/r68/
            _pages/docs/web-manifest-r62.json
          retention-days: 14
