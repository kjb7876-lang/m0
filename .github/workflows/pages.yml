name: StoryWorld R71 Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storyworld-pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    outputs:
      html_sha: ${{ steps.hashes.outputs.html_sha }}
      renderer_sha: ${{ steps.hashes.outputs.renderer_sha }}
    steps:
      - name: Checkout reviewed sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact baseline and preserve existing CPU gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/r66 out/r67 out/r68 out/r69 out/r70 out/r71
          python3 scripts/unpack-runtime-r62.py --output _baseline/docs
          python3 scripts/apply-r66.py --site _baseline/docs
          cp -a _baseline _pages
          python3 scripts/apply-r67.py --site _pages/docs | tee out/r67/build.log
          node --test scripts/campaign-balance-r64.cpu.test.mjs scripts/r66.cpu.test.mjs scripts/r66.render.test.mjs scripts/r67.cpu.test.mjs | tee out/r68/baseline-cpu.log
      - name: Install pinned sandboxed browser regression environment
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.56.0 > out/r71/dependencies.log 2>&1
          npx playwright install --with-deps chromium >> out/r71/dependencies.log 2>&1
      - name: Preserve R67 R68 R69 verification and validate exact R70 candidate
        shell: bash
        env:
          STORYWORLD_URL: http://127.0.0.1:4391/
        run: |
          set -euo pipefail
          python3 -m http.server 4391 --directory _pages/docs --bind 127.0.0.1 > out/r70/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r67.browser.test.mjs | tee out/r68/baseline-webgl.log
          mv _baseline _r66
          cp -a _pages _baseline
          python3 scripts/apply-r68.py --site _pages/docs | tee out/r68/build.log
          node --test scripts/r68.cpu.test.mjs | tee out/r68/cpu-tests.log
          node scripts/r68.browser.test.mjs | tee out/r68/webgl-test.log
          cp -a _pages _r68
          python3 scripts/apply-r69.py --site _pages/docs | tee out/r69/build.log
          node --check _pages/docs/dist/phase1.js
          BASELINE_RENDERER=_r68/docs/dist/phase1.js node --test scripts/r69.cpu.test.mjs | tee out/r69/cpu-tests.log
          node verify-pages-r62.mjs _pages | tee out/r69/integrity.log
          node scripts/r69.browser.test.mjs | tee out/r69/browser-tests.log
          cp -a _pages _r69
          python3 scripts/apply-r70.py --site _pages/docs | tee out/r70/build.log
          node --check _pages/docs/dist/phase1.js
          node --test scripts/r70.cpu.test.mjs | tee out/r70/cpu.log
          node verify-pages-r62.mjs _pages | tee out/r70/integrity.log
          node scripts/r70.browser.test.mjs | tee out/r70/webgl.log
          python3 scripts/r69-regression-wait.py
          node scripts/r66.browser.test.mjs | tee out/r70/game-regression.log
      - name: Require exact R70 baseline measured in PR run 39089788163
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={'index.html':'76791c87cf6b3f70d99f35aafc7dacaf3adb389f4be10081c024f8802a9aa5f5','dist/phase1.js':'b87e0feb34c321d19e557b7d08e63b9f0744f1e28b9e7d6e2ee7ea9ca0a6ebf4'}
          for name,want in expected.items():
              sha=hashlib.sha256(Path('_pages/docs',name).read_bytes()).hexdigest()
              if sha!=want:raise SystemExit('Unreviewed R70 baseline bytes: '+name+': '+sha)
          PY
      - name: Profile R70 first, then build and validate R71
        shell: bash
        env:
          STORYWORLD_URL: http://127.0.0.1:4391/
        run: |
          set -euo pipefail
          cp -a _pages _r70
          python3 -m http.server 4391 --directory _pages/docs --bind 127.0.0.1 > out/r71/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          R71_PERF_BASELINE_ONLY=1 node scripts/r71.perf.mjs | tee out/r71/baseline-profile.log
          python3 scripts/apply-r71.py --site _pages/docs | tee out/r71/build.log
          node --check _pages/docs/dist/phase1.js
          node --test scripts/r71-render.cpu.test.mjs scripts/r71-progression.cpu.test.mjs scripts/r71-health.cpu.test.mjs | tee out/r71/cpu.log
          node scripts/r71.audit.mjs | tee out/r71/audit.log
          node verify-pages-r62.mjs _pages | tee out/r71/integrity.log
          node scripts/r71.browser.test.mjs | tee out/r71/browser.log
          mkdir -p out/r71/native
          node scripts/r71-native.browser.test.mjs | tee out/r71/native/runner.log
          node scripts/r71.perf.mjs | tee out/r71/performance.log
      - name: Require exact approved R71 runtime hashes
        id: hashes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          approval=json.loads(Path('scripts/r71-approved-runtime.json').read_text())
          expected_baseline={
              'index.html':'76791c87cf6b3f70d99f35aafc7dacaf3adb389f4be10081c024f8802a9aa5f5',
              'dist/phase1.js':'b87e0feb34c321d19e557b7d08e63b9f0744f1e28b9e7d6e2ee7ea9ca0a6ebf4',
          }
          if approval.get('baseline')!=expected_baseline:
              raise SystemExit('R71 approval file has an unexpected R70 baseline')
          actual={name:hashlib.sha256(Path('_pages/docs',name).read_bytes()).hexdigest()
                  for name in ('index.html','dist/phase1.js')}
          approved=approval.get('approved')
          status=approval.get('status')
          if status not in ('approved','pending-review'):
              raise SystemExit('R71 approval status must be approved or pending-review')
          if status=='approved':
              if not isinstance(approved,dict) or actual!=approved:
                  raise SystemExit('R71 runtime differs from exact approved hashes: '+json.dumps(actual,sort_keys=True))
          elif os.environ['EVENT_NAME']!='pull_request' and os.environ['REF_NAME']=='refs/heads/main':
              raise SystemExit('R71 runtime hash pin is not approved; refusing Pages deployment: '+json.dumps(actual,sort_keys=True))
          else:
              print('R71_RUNTIME_MEASURED_PENDING_APPROVAL',json.dumps(actual,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('html_sha='+actual['index.html']+'\n')
              f.write('renderer_sha='+actual['dist/phase1.js']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r71-release-checks
          path: |
            out/r66/
            out/r67/
            out/r68/
            out/r69/
            out/r70/
            out/r71/
            _pages/docs/web-manifest-r62.json
          retention-days: 14
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload only verified static game files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages/docs
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTML and renderer match approved R71 hashes
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          HTML_SHA: ${{ needs.build.outputs.html_sha }}
          RENDERER_SHA: ${{ needs.build.outputs.renderer_sha }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          base=os.environ['PUBLIC_URL'].rstrip('/')+'/'
          expected={'':os.environ['HTML_SHA'],'dist/phase1.js':os.environ['RENDERER_SHA']};rows=[]
          for name,want in expected.items():
              for attempt in range(18):
                  url=base+name+'?release='+os.environ['SOURCE_COMMIT']+'&check='+str(attempt)
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'StoryWorld-Release-Verification'})
                      with urllib.request.urlopen(request,timeout=20) as response:data=response.read()
                      actual=hashlib.sha256(data).hexdigest()
                      if actual==want:
                          rows.append({'path':name or 'index.html','sha256':actual,'bytes':len(data),'status':'matched'});break
                      error='hash mismatch '+actual
                  except Exception as exc:error=str(exc)
                  time.sleep(5)
              else:raise SystemExit('Public release verification failed for '+name+': '+error)
          print('R70_PUBLIC_RELEASE_VERIFIED',json.dumps({'commit':os.environ['SOURCE_COMMIT'],'url':base,'files':rows}))
          PY
