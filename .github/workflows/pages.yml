name: StoryWorld R96 verified Pages
on:
  push:
    branches: [main, codex/r96-native-status]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storyworld-r96-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore hash-verified runtime and exact inherited QA inputs
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build-r96.py
          python scripts/prepare-r96-ci.py
          python r96/scripts/prepare-handoff-baselines.py
      - name: Execute all 58 inherited regression groups against this artifact
        env:
          STORYWORLD_QA_LABEL: ci-current
        run: node r96/qa/r95/run-full-suite.cjs
      - name: Require complete fresh 740-check evidence and immutable source
        run: |
          python - <<'PY'
          import json
          r=json.load(open('r96/qa/r95/ci-current/suite.json'))
          assert r['passed'] and r['fullSuite'] and r['groups']==58 and r['passedGroups']==58
          assert r['passedChecks']==r['totalChecks']==740 and r['sourceUnchangedDuringRun']
          PY
      - name: Exercise all 24 native status lifecycle and layering checks
        run: |
          node r96/qa/r96/status-native-check.cjs
          python - <<'PY'
          import json
          r=json.load(open('r96/qa/r96/status-native-results.json'))
          assert len(r['checks'])==24 and all(v['passed'] for v in r['checks'])
          PY
      - name: R103 사몽 loop, maze connectivity, growth costs and 777 prescriptions
        run: node r96/qa/r103/samong-cpu-check.cjs
      - name: R104 boss key-pose frames, pivots and draw-only swap
        run: node r96/qa/r104/bosses-cpu-check.cjs
      - name: R105 narrative blueprints, markers, 777 sections and static props
        run: node r96/qa/r105/samong-maps-cpu-check.cjs
      - name: R106 improved canon story text check
        run: node r96/qa/r106/story-canon-cpu-check.cjs
      - name: R106 effect textures, texture-first primitives and D2S casts
        run: node r96/qa/r106/fx-cpu-check.cjs
      - name: R106 wide survival fields, complex flashlight mazes, faster swarm
        run: node r96/qa/r106/samong-scale-cpu-check.cjs
      - name: R106 play CPU check (enemy facing, difficulty Enter, survival orbs/push-back, hero veil)
        run: node r96/qa/r106/play-cpu-check.cjs
      - name: R109 mob cross-frame motion (R92/R109 strips, no squash/stretch)
        run: node r96/qa/r109/mobs-cpu-check.cjs
      - name: R110 mob idle and Drive-art move strips check
        run: node r96/qa/r110/mobs-art-idle-cpu-check.cjs
      - name: R111 play CPU check (combat facing, 777 resonance, guard, samong cut, ranged, 7 tiers, attack-cell facing)
        run: node r96/qa/r111/play-cpu-check.cjs
      - name: R112 canon swap and 제7부 mob composition check
        run: node r96/qa/r112/mobs-cpu-check.cjs
      - name: R113 play CPU check (ranged no blink, combat facing, prop grounding, thrown pops, physics, foot dust)
        run: node r96/qa/r113/play-cpu-check.cjs
      - name: R114 combat and cinema CPU check
        run: node r96/qa/r114/combat-cpu-check.cjs
      - name: R115 samong zones CPU check (108 zones, text coverage, layouts, save migration)
        run: node r96/qa/r115/zones-cpu-check.cjs
      - name: R115 play CPU check (hit centre, boss aim, assist, spacing, props, light, 사몽선, skill book)
        run: node r96/qa/r115/play-cpu-check.cjs
      - name: R116 port of R108 hero portraits, ward champions, signature bolts, crates
        run: node r96/qa/r108/heroes-mobs-cpu-check.cjs
      - name: R116 port of R108 BGM continuity
        run: node r96/qa/r108/audio-cpu-check.cjs
      - name: R116 Dark Eden skill FX with growth tiers
        run: node r96/qa/r116/eden-cpu-check.cjs
      - name: R116 Drive mob hit/idle 4-key strips (29 hit, 12 idle)
        run: node r96/qa/r116/mobs-hit-idle-cpu-check.cjs
      - name: R117 scene props (Drive one-shot 4-key props in samong zones)
        run: node r96/qa/r117/scene-props-cpu-check.cjs
      - name: R118 boss skill rotation, status ground, hero facing, tick cap, splash, combat run, HP curve, Drive weapons
        run: node r96/qa/r118/combat-cpu-check.cjs
      - name: R118 Drive map-surface tiles (region floors/walls, samong zone keys, hospital excluded)
        run: node r96/qa/r118/tiles-cpu-check.cjs
      - name: R119 effect merging, off-screen culling, EGO flash
        run: node r96/qa/r119/perf-cpu-check.cjs
      - name: R123 samong zone mood (tower floors, Neo Seoul years and eras, rose house, night school, six painters)
        run: node r96/qa/r123/mood-cpu-check.cjs
      - name: R123 dark fantasy horror tone (rust/blood grade on top of R114, torch pools, fog, embers)
        run: node r96/qa/r123/dark-cpu-check.cjs
      - name: R125 samong zone ambience (synthesised beds and events per mood, quiet rules, cleanup)
        run: node r96/qa/r125/ambience-cpu-check.cjs
      - name: R134 guide portal (normal intent, difficulty watchdog) and walk foot anchor
        run: node r96/qa/r134/guide-cpu-check.cjs
      - name: R135 hero motion (blocked-walk flicker, walk anchor, still scale/pivot/crop, slayer atlas)
        run: node r96/qa/r135/motion-cpu-check.cjs
      - name: R137 mob rules and resonance guard (illusion, midboss size, facing, root bind, cleanse, auto guard, blink walls)
        run: node r96/qa/r137/combat-cpu-check.cjs
      - name: R138 drive props CPU check
        run: node r96/qa/r138/drive-props-cpu-check.cjs
      - name: R139 samong ultimate, Lauren meteor violet/cross, guide altar/exit/portal
        run: node r96/qa/r139/samong-lauren-cpu-check.cjs
      - name: R140 props variety/count, hero walk scale and single body
        run: node r96/qa/r140/props-heroes-cpu-check.cjs
      - name: R141 line-of-sight reuse, wall trim material reuse, Drive root prop
        run: node r96/qa/r141/perf-cpu-check.cjs
      - name: R142 mobile settings (start menu button, condensed quick settings)
        run: node r96/qa/r142/mobile-settings-cpu-check.cjs
      - name: R143 hero foot ring on the ground layer, opening intro removed
        run: node r96/qa/r143/feet-intro-cpu-check.cjs
      - name: R147 lag — full-screen layers stop repainting every frame, mobile CSS filter off, caches
        run: node r96/qa/r147/perf-paint-cpu-check.cjs
      - name: R148 hero walk cadence and single bob
        run: node r96/qa/r148/walk-cadence-cpu-check.cjs
      - name: R150 lite screen (auto/on/off) and performance meter
        run: node r96/qa/r150/perf-lite-cpu-check.cjs
      - name: R151 hero collapse animation before the death panel
        run: node r96/qa/r151/death-anim-cpu-check.cjs
      - name: R152 pointer query once, cached stage rects
        run: node r96/qa/r152/perf-small-cpu-check.cjs
      - name: R154 image crop memory across zone reloads
        run: node r96/qa/r154/crop-memo-cpu-check.cjs
      - name: R155 decal/lamp nearest-wall grid equals the all-walls answer
        run: node r96/qa/r155/decal-grid-cpu-check.cjs
      - name: R156 R90 floor-mark nearest-wall grid equals the all-walls answer
        run: node r96/qa/r156/decal-r90-grid-cpu-check.cjs
      - name: R159 code-review fixes (no missing directional art requests, item map) and autoplay tool
        run: node r96/qa/r159/review-fixes-cpu-check.cjs
      - name: R160 combat effects and hotbar CPU check
        run: node r96/qa/r160/combat-cpu-check.cjs
      - name: R161 samong puppet ego, memory fragment sculpture and blood memory tile CPU check
        run: node r96/qa/r161/samong-assets-cpu-check.cjs
      - name: R162 samong combat-first reshape (B plaza, D core lane, fragments, boss patterns) CPU check
        run: node r96/qa/r162/samong-combat-cpu-check.cjs
      - name: R163 pixelfx (MIT) sheets, player and hooks CPU check
        run: node r96/qa/r163/pixelfx-cpu-check.cjs
      - name: R164 michaela run sheets (Drive movement v1) CPU check
        run: node r96/qa/r164/michaela-run-cpu-check.cjs
      - name: Install pinned sandboxed Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser start, save, portal, exact atlas decode and native status lifecycle
        env:
          STORYWORLD_URL: http://127.0.0.1:4396/m0/
        run: |
          set -euo pipefail
          mkdir -p out
          ln -s "$PWD/r96/hospital-three-pc/site" out/m0
          python -m http.server 4396 --bind 127.0.0.1 --directory out > r96/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r96.browser.mjs
      - name: Revalidate every release byte after all tests
        run: python scripts/verify-r96-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r96-evidence-${{ github.run_id }}
          path: |
            r96/build-result.json
            r96/release-result.json
            r96/browser-results.json
            r96/*.png
            r96/http.log
            r96/qa/r95/ci-current/
            r96/qa/r96/status-native-results.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: r96/hospital-three-pc/site
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public manifest and changed runtime/assets
        env:
          STORYWORLD_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify-r96-public.py
      - name: Install pinned sandboxed public smoke browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify actual public start, save reload, E portal and status effects
        env:
          STORYWORLD_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/r96.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r96-public-${{ github.run_id }}
          path: |
            r96/public-result.json
            r96/browser-results.json
            r96/*.png
          retention-days: 14
