name: StoryWorld SW-0025 visual pairs only
on:
  push:
    branches: [sw0025-visual-20261123]
permissions:
  contents: read
concurrency:
  group: storyworld-sw0025-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-pairs:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build source with the exact verified candidate manifests
        run: |
          set -euo pipefail
          sha256sum -c <<'HASHES'
          8cb01a2ac0c458dd567b5550a45e6b841d2279c2bd821c1c4ddc21e6d100810f  r96/runtime-manifest.json
          85e54bdff22aa25342ff55c6cec8dcdd7b2ecda5b639bf68cc57de9f9a3d06a9  r96/runtime-inputs.json
          HASHES
          python -m pip install Pillow==11.3.0 pyoxipng==9.1.1
          python scripts/build-r96.py
      - name: Install pinned Chromium for OS-sandboxed use
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Capture paired evidence using the exact built runtime
        env:
          SW25_PROOF_URL: http://127.0.0.1:4396/m0/
          SW25_PROOF_OUTPUT: r96/sw0025-visual-pairs
        run: |
          set -euo pipefail
          mkdir -p out
          ln -s "$PWD/r96/hospital-three-pc/site" out/m0
          python -m http.server 4396 --bind 127.0.0.1 --directory out > r96/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node r96/qa/sw0025/visual-pairs.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw0025-visual-pairs-${{ github.run_id }}
          path: |
            r96/sw0025-visual-pairs/
            r96/http.log
            r96/build-result.json
          retention-days: 14
