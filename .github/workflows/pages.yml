name: StoryWorld R68 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storyworld-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    outputs:
      html_sha: ${{ steps.hashes.outputs.html_sha }}
      renderer_sha: ${{ steps.hashes.outputs.renderer_sha }}
    steps:
      - name: Checkout reviewed sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact baseline and preserve existing CPU gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/r66 out/r67 out/r68
          python3 scripts/unpack-runtime-r62.py --output _baseline/docs
          python3 scripts/apply-r66.py --site _baseline/docs
          cp -a _baseline _pages
          python3 scripts/apply-r67.py --site _pages/docs | tee out/r67/build.log
          node --test scripts/campaign-balance-r64.cpu.test.mjs scripts/r66.cpu.test.mjs scripts/r66.render.test.mjs scripts/r67.cpu.test.mjs | tee out/r68/baseline-cpu.log
      - name: Install pinned sandboxed browser regression environment
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.56.0 > out/r68/dependencies.log 2>&1
          npx playwright install --with-deps chromium >> out/r68/dependencies.log 2>&1
      - name: Gate R68 publication on all baseline and candidate regressions
        shell: bash
        env:
          STORYWORLD_URL: http://127.0.0.1:4391/
        run: |
          set -euo pipefail
          python3 -m http.server 4391 --directory _pages/docs --bind 127.0.0.1 > out/r68/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r67.browser.test.mjs | tee out/r68/baseline-webgl.log
          mv _baseline _r66
          cp -a _pages _baseline
          python3 scripts/apply-r68.py --site _pages/docs | tee out/r68/build.log
          node --check _pages/docs/dist/phase1.js
          node --test scripts/r68.cpu.test.mjs | tee out/r68/cpu-tests.log
          node verify-pages-r62.mjs _pages | tee out/r68/integrity.log
          node scripts/r68.browser.test.mjs | tee out/r68/webgl-test.log
          node scripts/r66.browser.test.mjs | tee out/r68/game-regression.log
      - name: Require exact already-reviewed runtime bytes
        id: hashes
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          expected = {
              'index.html': '5d990d8c6d7b84a1de04fa18431f8696db0bda5e8e42e7ad3d76753e072e6206',
              'dist/phase1.js': 'bfe84ba90aa5097a0e512403869e12e4799a3284fe5f839fbbe33f48f4daa8ea',
          }
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,name in [('html_sha','index.html'),('renderer_sha','dist/phase1.js')]:
                  sha=hashlib.sha256(Path('_pages/docs',name).read_bytes()).hexdigest()
                  if sha != expected[name]:
                      raise SystemExit('Unreviewed runtime bytes: '+name+': '+sha)
                  print(key,sha)
                  f.write(key+'='+sha+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r68-release-checks
          path: |
            out/r66/
            out/r67/
            out/r68/
            _pages/docs/web-manifest-r62.json
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only verified static game files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages/docs
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTML and renderer match approved hashes
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          HTML_SHA: ${{ needs.build.outputs.html_sha }}
          RENDERER_SHA: ${{ needs.build.outputs.renderer_sha }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          base=os.environ['PUBLIC_URL'].rstrip('/')+'/'
          expected={'':os.environ['HTML_SHA'],'dist/phase1.js':os.environ['RENDERER_SHA']}
          rows=[]
          for name,want in expected.items():
              for attempt in range(18):
                  url=base+name+'?release='+os.environ['SOURCE_COMMIT']+'&check='+str(attempt)
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'StoryWorld-Release-Verification'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          data=response.read()
                          actual=hashlib.sha256(data).hexdigest()
                      if actual==want:
                          rows.append({'path':name or 'index.html','sha256':actual,'bytes':len(data),'status':'matched'})
                          break
                      error='hash mismatch '+actual
                  except Exception as exc:
                      error=str(exc)
                  time.sleep(5)
              else:
                  raise SystemExit('Public release verification failed for '+name+': '+error)
          print('R68_PUBLIC_RELEASE_VERIFIED',json.dumps({'commit':os.environ['SOURCE_COMMIT'],'url':base,'files':rows}))
          PY
