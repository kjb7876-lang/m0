name: StoryWorld R96 verified Pages
on:
  push:
    branches: [main, codex/r96-native-status]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storyworld-r96-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore hash-verified runtime and exact inherited QA inputs
        run: |
          python -m pip install Pillow==11.3.0 pyoxipng==9.1.1
          python scripts/build-r96.py
          python scripts/prepare-r96-ci.py
          python r96/scripts/prepare-handoff-baselines.py
      - name: R1247 Dots sheet intake check (jitter, bleed, foot baseline)
        run: python scripts/r1247-sheet-intake.cpu.test.py
      - name: Survival caster ownership, placement lifecycle and H command regression
        run: |
          node r96/qa/r1124/combat-ownership-cpu.cjs
          node r96/qa/r1124/slots-cpu-check.cjs
          node r96/qa/r1124/command-cpu-check.cjs
      - name: Execute all 58 inherited regression groups against this artifact
        env:
          STORYWORLD_QA_LABEL: ci-current
        run: node r96/qa/r95/run-full-suite.cjs
      - name: Require complete fresh 741-check evidence and immutable source
        run: |
          python - <<'PY'
          import json
          r=json.load(open('r96/qa/r95/ci-current/suite.json'))
          assert r['passed'] and r['fullSuite'] and r['groups']==58 and r['passedGroups']==58
          assert r['passedChecks']==r['totalChecks']==742 and r['sourceUnchangedDuringRun']
          PY
      - name: Exercise all 24 native status lifecycle and layering checks
        run: |
          node r96/qa/r96/status-native-check.cjs
          python - <<'PY'
          import json
          r=json.load(open('r96/qa/r96/status-native-results.json'))
          assert len(r['checks'])==24 and all(v['passed'] for v in r['checks'])
          PY
      - name: Check registered Mammon artwork and native map
        run: node r96/qa/mammon-miniature-pilot/check.cjs
      - name: Seven sin boss rooms scope, collision and save compatibility
        run: |
          node r96/qa/seven-sins/bossrooms-cpu-check.cjs
          node r96/qa/seven-sins/bossrooms-runtime-check.cjs
