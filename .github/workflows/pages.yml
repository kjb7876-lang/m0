name: StoryWorld R96 verified Pages
on:
  push:
    branches: [main, codex/r96-native-status]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storyworld-r96-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore hash-verified runtime and exact inherited QA inputs
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build-r96.py
          python scripts/prepare-r96-ci.py
          python r96/scripts/prepare-handoff-baselines.py
      - name: Execute all 58 inherited regression groups against this artifact
        env:
          STORYWORLD_QA_LABEL: ci-current
        run: node r96/qa/r95/run-full-suite.cjs
      - name: Require complete fresh 740-check evidence and immutable source
        run: |
          python - <<'PY'
          import json
          r=json.load(open('r96/qa/r95/ci-current/suite.json'))
          assert r['passed'] and r['fullSuite'] and r['groups']==58 and r['passedGroups']==58
          assert r['passedChecks']==r['totalChecks']==740 and r['sourceUnchangedDuringRun']
          PY
      - name: Exercise all 24 native status lifecycle and layering checks
        run: |
          node r96/qa/r96/status-native-check.cjs
          python - <<'PY'
          import json
          r=json.load(open('r96/qa/r96/status-native-results.json'))
          assert len(r['checks'])==24 and all(v['passed'] for v in r['checks'])
          PY
      - name: Install pinned sandboxed Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser start, save, portal, exact atlas decode and native status lifecycle
        env:
          STORYWORLD_URL: http://127.0.0.1:4396/m0/
        run: |
          set -euo pipefail
          mkdir -p out
          ln -s "$PWD/r96/hospital-three-pc/site" out/m0
          python -m http.server 4396 --bind 127.0.0.1 --directory out > r96/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r96.browser.mjs
      - name: Revalidate every release byte after all tests
        run: python scripts/verify-r96-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r96-evidence-${{ github.run_id }}
          path: |
            r96/build-result.json
            r96/release-result.json
            r96/browser-results.json
            r96/*.png
            r96/http.log
            r96/qa/r95/ci-current/
            r96/qa/r96/status-native-results.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: r96/hospital-three-pc/site
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public manifest and changed runtime/assets
        env:
          STORYWORLD_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify-r96-public.py
      - name: Install pinned sandboxed public smoke browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify actual public start, save reload, E portal and status effects
        env:
          STORYWORLD_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/r96.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r96-public-${{ github.run_id }}
          path: |
            r96/public-result.json
            r96/browser-results.json
            r96/*.png
          retention-days: 14
