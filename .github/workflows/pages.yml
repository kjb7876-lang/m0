      - name: Install pinned sandboxed Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser start, save, portal, exact atlas decode and native status lifecycle
        env:
          STORYWORLD_URL: http://127.0.0.1:4396/m0/
        run: |
          set -euo pipefail
          mkdir -p out
          ln -s "$PWD/r96/hospital-three-pc/site" out/m0
          python -m http.server 4396 --bind 127.0.0.1 --directory out > r96/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r96.browser.mjs
      - name: Revalidate every release byte after all tests
        run: python scripts/verify-r96-release.py
      - name: R580 Pages bundle under the size budget in pages-exclude.json (1.1GB since R454 narration, archival narration excluded, lossless PNG, pixel-identical, public verifier)
        run: python r96/qa/r580/pages-size-check.py
      - name: R580 public verifier retries transient read timeouts/disconnects but still fails wrong, missing or never-arriving bytes
        run: |
          python scripts/pages-pack.py --site r96/hospital-three-pc/site --out "$RUNNER_TEMP/r580-pages"
          python r96/qa/r580/public-retry-check.py "$RUNNER_TEMP/r580-pages"
          rm -rf "$RUNNER_TEMP/r580-pages"
      - name: R580 pack the Pages bundle from the verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/pages-pack.py --site r96/hospital-three-pc/site --out r96/hospital-three-pc/pages
      - name: R615 pack heavy assets for the Cloudflare Pages asset project (free plan, no payment method; 20,000 files / 25MiB per file)
        run: python scripts/cdn-pack.py --site r96/hospital-three-pc/site --out "$RUNNER_TEMP/r615-cdn"
      - name: R615 upload heavy assets to Cloudflare Pages and verify them publicly (main only; skipped until repo secrets exist; the game falls back to GitHub Pages)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "R615: Cloudflare secrets not set, upload skipped (game keeps using GitHub Pages)"; exit 0; fi
          PROJECT=$(python -c "import json;print(json.load(open('r96/asset-cdn.json'))['project'])")
          npx --yes wrangler@4.154.0 pages project list | grep -q "$PROJECT" || npx --yes wrangler@4.154.0 pages project create "$PROJECT" --production-branch main
          npx --yes wrangler@4.154.0 pages deploy "$RUNNER_TEMP/r615-cdn" --project-name "$PROJECT" --branch main --commit-dirty=true
          python scripts/cdn-verify.py --pack "$RUNNER_TEMP/r615-cdn"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r96-evidence-${{ github.run_id }}
          path: |
            r96/build-result.json
            r96/release-result.json
            r96/browser-results.json
            r96/*.png
            r96/http.log
            r96/qa/r95/ci-current/
            r96/qa/r96/status-native-results.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: r96/hospital-three-pc/pages
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public manifest and changed runtime/assets
        env:
          STORYWORLD_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify-r96-public.py
      - name: Install pinned sandboxed public smoke browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify actual public start, save reload, E portal and status effects
        env:
          STORYWORLD_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/r96.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r96-public-${{ github.run_id }}
          path: |
            r96/public-result.json
            r96/browser-results.json
            r96/*.png
          retention-days: 14
