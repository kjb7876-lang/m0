name: StoryWorld R73 bootloader diagnosis
on:
  push:
    branches: [feat/r72-golden-thread]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r73-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        script: [r73-ui, r73-diagnose, r73-slots.browser, r73-native, r73-route.browser, r73-features, r73-render.browser, r73-memory.browser, r73-maze.browser]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact baseline
        run: |
          set -euo pipefail
          python3 scripts/unpack-runtime-r62.py --output _pages/docs
          for rev in 66 67 68 69 70; do python3 scripts/apply-r$rev.py --site _pages/docs; done
          cp -a _pages _r70
          python3 scripts/apply-r71.py --site _pages/docs
          cp -a _pages _r71
          python3 scripts/apply-r72.py --site _pages/docs
          cp -a _pages _r72
          python3 scripts/apply-r73.py --site _pages/docs
          node --test scripts/r73.cpu.test.mjs scripts/r73-slots.cpu.test.mjs scripts/r73-dom.cpu.test.mjs scripts/r73-maze.cpu.test.mjs
      - name: Install sandboxed Chromium
        run: |
          npm ci --ignore-scripts --prefix relay
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run independent sandboxed browser scenario
        env:
          R73_COMPARE: '1'
          R73_ABBA: '1'
          SCENARIO: ${{ matrix.script }}
        run: |
          set -euo pipefail
          mkdir -p out/r73
          python3 -m http.server 4391 --directory _pages/docs --bind 127.0.0.1 > out/r73/http.log 2>&1 &
          SERVER_PID=$!
          python3 -m http.server 4392 --directory _r71/docs --bind 127.0.0.1 > out/r73/r71-http.log 2>&1 &
          BASELINE_PID=$!
          python3 -m http.server 4393 --directory _r72/docs --bind 127.0.0.1 > out/r73/r72-http.log 2>&1 &
          R72_PID=$!
          trap 'kill "$SERVER_PID" "$BASELINE_PID" "$R72_PID" 2>/dev/null || true' EXIT
          node "scripts/$SCENARIO.mjs" | tee out/r73/runner.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r73-${{ matrix.script }}-${{ github.sha }}
          path: |
            out/r73/
            out/r71/native/
          retention-days: 14
