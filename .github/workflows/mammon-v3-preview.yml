name: Mammon V16 real combat capture supplement
on:
  push:
    branches: [codex/mammon-v16-combat-evidence]
permissions:
  contents: read
jobs:
  combat:
    name: real input (${{ matrix.view }}, ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        view: [pc, mobile]
        version: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve the small observation driver
        uses: actions/checkout@v6
        with:
          path: probe
          sparse-checkout: r96/qa/mammon-miniature-pilot
          persist-credentials: false
      - name: Check out the exact V16 game tree
        uses: actions/checkout@v6
        with:
          ref: dc3e094284cc4ac3cfac78d182d461b0aa7fd614
          path: game
          persist-credentials: false
      - name: Build immutable R382 and its isolated V16 candidate
        working-directory: game
        run: |
          test "$(git rev-parse HEAD)" = dc3e094284cc4ac3cfac78d182d461b0aa7fd614
          python3 scripts/build-r96.py
          node r96/qa/mammon-miniature-pilot/prepare-preview.cjs --site r96/hospital-three-pc/site --out "$RUNNER_TEMP/mammon-v16"
          test "$(sha256sum "$RUNNER_TEMP/mammon-v16/mammon-miniature-pilot.js" | cut -d' ' -f1)" = 765240d42b21c27a6925a68ce899b3b3d761e8ca1d7b48c7ecfe4756799e0d60
      - name: Korean glyphs
        run: |
          if [ -z "$(fc-list :lang=ko family)" ]; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
      - name: Observe a real guided encounter after 777 entry
        env:
          QA_VIEW: ${{ matrix.view }}
          QA_VERSION: ${{ matrix.version }}
        run: |
          site="$GITHUB_WORKSPACE/game/r96/hospital-three-pc/site"
          if [ "$QA_VERSION" = after ]; then site="$RUNNER_TEMP/mammon-v16"; fi
          python3 -m http.server 4312 --bind 127.0.0.1 --directory "$site" > "$RUNNER_TEMP/mammon-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd game
          cp ../probe/r96/qa/mammon-miniature-pilot/live-combat-probe.py "$RUNNER_TEMP/probe.py"
          python3 "$RUNNER_TEMP/probe.py" --url http://127.0.0.1:4312/ --view "$QA_VIEW" --variant "$QA_VERSION" --out "$RUNNER_TEMP/live-combat" --max-seconds 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: live-combat-${{ matrix.version }}-${{ matrix.view }}-dc3e094
          path: ${{ runner.temp }}/live-combat/
