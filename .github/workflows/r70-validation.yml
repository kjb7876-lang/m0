name: StoryWorld R70 candidate verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*r70*'
      - '.github/workflows/r70-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r70-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact published R69 baseline and R70 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/r70
          python3 scripts/unpack-runtime-r62.py --output _pages/docs
          python3 scripts/apply-r66.py --site _pages/docs
          python3 scripts/apply-r67.py --site _pages/docs
          python3 scripts/apply-r68.py --site _pages/docs
          cp -a _pages _r68
          python3 scripts/apply-r69.py --site _pages/docs
          cp -a _pages _r69
          python3 scripts/apply-r70.py --site _pages/docs | tee out/r70/build.log
          node --check _pages/docs/dist/phase1.js
          node --test scripts/r70.cpu.test.mjs | tee out/r70/cpu.log
          node verify-pages-r62.mjs _pages | tee out/r70/integrity.log
      - name: Install pinned sandboxed browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0 > out/r70/dependencies.log 2>&1
          npx playwright install --with-deps chromium >> out/r70/dependencies.log 2>&1
      - name: Exact pixels, all existing gameplay assertions, and same-Three paired performance
        shell: bash
        env:
          STORYWORLD_URL: http://127.0.0.1:4391/
        run: |
          set -euo pipefail
          python3 -m http.server 4391 --directory _pages/docs --bind 127.0.0.1 > out/r70/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/r70.browser.test.mjs | tee out/r70/webgl.log
          python3 scripts/r69-regression-wait.py
          node scripts/r66.browser.test.mjs > out/r70/existing-regression.log 2>&1
          node scripts/r70.perf.mjs | tee out/r70/performance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r70-candidate-evidence
          path: |
            out/r70/
            out/r66/
            _pages/docs/web-manifest-r62.json
          retention-days: 14
