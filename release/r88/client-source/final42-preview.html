<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryWorld 그림 프레임 42종 미리보기</title><style>body{margin:0;background:#111921;color:#e3e8ed;font:15px system-ui}main{max-width:1024px;margin:24px auto;padding:16px}label,button,select{margin:5px;font:inherit}select,button{padding:7px;background:#263440;color:inherit;border:1px solid #72808b;border-radius:5px}canvas{display:block;width:100%;height:560px;border:1px solid #50616e;margin-top:14px}p{line-height:1.6}small{color:#aab8c3}#state{min-height:24px}</style><main><h1>그림 프레임 42종</h1><p>원본 아틀라스와 재생 순서를 확인하는 별도 미리보기입니다. 실제 전투 판정·캐릭터 가림·게임 GPU 검증을 대신하지 않습니다.</p><label>효과 <select id="effect"></select></label><label>클립 <select id="clip"></select></label><label>배경 <select id="bg"><option value="#111921">어둡게</option><option value="#e8e5dc">밝게</option><option value="grid">격자</option></select></label><label>표시 크기 <select id="size"><option value="192">192px</option><option value="96">96px</option><option value="320">320px</option></select></label><button id="replay">다시 재생</button><button id="pause">일시정지</button><canvas id="canvas" width="960" height="560"></canvas><p id="state"></p><small>붉은 십자: 고정 피벗. F6 오라는 정/역방향 순서이며, 가시 속박은 단일 레이어입니다. 전체 PNG를 한 번에 메모리에 올리지 않습니다.</small></main><script src="./final42-data-r88.js"></script><script>
'use strict';const D=window.__STORYWORLD_FINAL42_DATA_R88__,effects=document.querySelector('#effect'),clips=document.querySelector('#clip'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),state=document.querySelector('#state');let image=null,epoch=0,age=0,last=performance.now(),paused=false,ready=false;
for(const s of Object.values(D.effects)){const o=document.createElement('option');o.value=s.id;o.textContent=s.id+' · '+s.name;effects.add(o);}
function choose(){const s=D.effects[effects.value];clips.replaceChildren();for(const [id,c]of Object.entries(s.clips)){const o=document.createElement('option');o.value=id;o.textContent=id+(c.loop?' ↔ 반복':'');clips.add(o);}clips.value=s.defaultClip;age=0;ready=false;const n=++epoch;if(image){image.onload=image.onerror=null;image.src='';}image=new Image();image.onload=()=>{if(n===epoch)ready=true;};image.onerror=()=>{if(n===epoch)state.textContent='이미지 읽기 실패';};image.src='./'+s.atlases[0].path;}
function sample(s,c,t){const seq=c.frameIndices||c.frames;const duration=seq.reduce((v,i)=>v+s.frames[i].seconds,0);if(c.loop)t%=duration;else if(t>=duration)return null;for(const i of seq){const f=s.frames[i];if(t<f.seconds)return f;t-=f.seconds;}return null;}
function draw(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused)age+=dt;const s=D.effects[effects.value],c=s.clips[clips.value],bg=document.querySelector('#bg').value;ctx.fillStyle=bg==='grid'?'#32424d':bg;ctx.fillRect(0,0,canvas.width,canvas.height);if(bg==='grid'){ctx.fillStyle='#485b67';for(let y=0;y<560;y+=24)for(let x=0;x<960;x+=24)if((x/24+y/24)%2===0)ctx.fillRect(x,y,24,24);}const x=480,y=s.pivot[1]>.7?430:290,f=sample(s,c,age);if(ready&&f){const max=Number(document.querySelector('#size').value),k=max/Math.max(...s.cell),w=s.cell[0]*k,h=s.cell[1]*k;ctx.save();ctx.globalCompositeOperation=s.blend;ctx.drawImage(image,...f.rect,x-w*s.pivot[0],y-h*s.pivot[1],w,h);ctx.restore();}ctx.strokeStyle='#e25656';ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke();if(ready)state.textContent=s.id+' · '+age.toFixed(2)+'초 · '+(f?'frame '+f.index:'재생 종료')+' · pivot '+s.pivot.join(', ');requestAnimationFrame(draw);}
effects.onchange=choose;clips.onchange=()=>age=0;document.querySelector('#replay').onclick=()=>age=0;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'계속':'일시정지';};choose();requestAnimationFrame(draw);
</script></html>
