<title id="title">StoryWorld original VFX · harvest</title>
<desc id="desc">An original crescent sickle gently pivots as three sparse pale motes follow curved inward paths toward its blade. Transparent standalone SMIL animation; 6.8 second primary animation cycle, with continuous looping. Original asset, not a canonical character or boss depiction.</desc>
<defs>
