      <radialGradient id="aura"><stop stop-color="#a7bc7b" stop-opacity=".20"/><stop offset=".62" stop-color="#a7bc7b" stop-opacity=".08"/><stop offset="1" stop-color="#a7bc7b" stop-opacity="0"/></radialGradient>
      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7ffff"/><stop offset=".24" stop-color="#aac8db"/><stop offset=".48" stop-color="#ffffff"/><stop offset=".53" stop-color="#47667e"/><stop offset=".8" stop-color="#e0f3ff"/><stop offset="1" stop-color="#718ba0"/></linearGradient>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.4"/></filter>
      <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.25"/></filter>
