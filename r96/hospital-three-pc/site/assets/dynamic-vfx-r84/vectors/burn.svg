<title id="title">StoryWorld original VFX · burn</title>
<desc id="desc">Three nested organic flame silhouettes breathe above a heat ring while five embers rise and fade at staggered intervals. Transparent standalone SMIL animation; 4.8 second primary animation cycle, with continuous looping. Original asset, not a canonical character or boss depiction.</desc>
