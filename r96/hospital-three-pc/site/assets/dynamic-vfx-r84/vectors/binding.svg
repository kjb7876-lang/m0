<title id="title">StoryWorld original VFX · binding</title>
<desc id="desc">Two elongated metal-link restraints interlock around a small central clasp while four fine anchors tighten and relax. Transparent standalone SMIL animation; 6.4 second primary animation cycle, with continuous looping. Original asset, not a canonical character or boss depiction.</desc>
