<title id="title">StoryWorld original VFX · bleed</title>
<desc id="desc">A sharp crimson incision opens, then releases staggered weighty drops with small pale highlights and a gentle red halo. Transparent standalone SMIL animation; 5 second primary animation cycle, with continuous looping. Original asset, not a canonical character or boss depiction.</desc>
