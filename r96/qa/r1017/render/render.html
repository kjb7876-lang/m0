<!doctype html><html><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
window.renderOne=async(url,opt)=>{
 const S=opt.size||1024;
 const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
 r.setSize(S,S);r.setClearColor(0x000000,0);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=opt.exposure||1.0;r.outputColorSpace=THREE.SRGBColorSpace;
 r.shadowMap.enabled=true;
 document.body.appendChild(r.domElement);
 const sc=new THREE.Scene();
 const g=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(url);
 const m=g.scene;m.rotation.y=(opt.rotY||0)*Math.PI/180;sc.add(m);
 m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 const box=new THREE.Box3().setFromObject(m),c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
 const el=(opt.elev||30)*Math.PI/180,dir=new THREE.Vector3(Math.cos(el)*Math.SQRT1_2,Math.sin(el),Math.cos(el)*Math.SQRT1_2);
 const R=sz.length();const cam=new THREE.OrthographicCamera(-R/2,R/2,R/2,-R/2,0.01,R*10);
 cam.position.copy(c).addScaledVector(dir,R*3);cam.lookAt(c);
 sc.add(new THREE.HemisphereLight(0x8090b0,0x201510,opt.amb??0.5));
 const key=new THREE.DirectionalLight(0xffc890,opt.key??2.6);key.position.copy(c).add(new THREE.Vector3(-R*1.2,R*1.6,R*1.0));key.target.position.copy(c);key.castShadow=true;
 key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-R,right:R,top:R,bottom:-R,near:.01,far:R*6});key.shadow.bias=-0.0005;sc.add(key,key.target);
 const rim=new THREE.DirectionalLight(0x7f95ff,opt.rim??1.4);rim.position.copy(c).add(new THREE.Vector3(R*.4,R*.8,-R*1.6));sc.add(rim);
 const fill=new THREE.DirectionalLight(0xff8040,0.35);fill.position.copy(c).add(new THREE.Vector3(R*1.5,R*.3,R*.6));sc.add(fill);
 r.render(sc,cam);
 // tight crop by projecting pivot (bottom centre of bbox base) 
 const base=new THREE.Vector3(c.x,box.min.y,c.z).project(cam);
 return {png:r.domElement.toDataURL('image/png'),pivot:[(base.x+1)/2*S,(1-base.y)/2*S],dims:[sz.x,sz.y,sz.z]};
};
window.ready=true;
</script></body></html>
