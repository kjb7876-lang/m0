# StoryWorld R62 quick deployment for the approved m0 Pages client.
# Creates one Free relay service only when deployed from the user's Render account.
services:
  - type: web
    name: storyworld-r62-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'commit'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://kjb7876-lang.github.io
